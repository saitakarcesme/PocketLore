plugins { id 'com.android.application' }
android {
    namespace 'org.pocketlore.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pocketlore.app'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner project.findProperty('pocketloreTestRunner') ?: 'org.pocketlore.app.NativeSmokeInstrumentation'
        versionCode 1
        versionName '0.1.0-bootstrap'
    }
    sourceSets.main.jniLibs.srcDirs = ['build/generated/nativeLibs']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('verifyKnowledgePack') {
    doLast {
        if (!file('src/main/assets/water-science.tsv').isFile()) {
            throw new GradleException('Missing knowledge pack: run tools/android-knowledge-pack.py with a source cache before building.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyKnowledgePack' }

tasks.register('buildPocketLoreNative', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'bash', 'tools/runtime/build-native.sh'
}
tasks.named('preBuild').configure { dependsOn 'buildPocketLoreNative' }

// Offline source verification and reproducible generation; fetch is an explicit setup step.
tasks.register('buildTravelPack', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/packs/build_travel.py', '--install'
}
tasks.named('preBuild').configure { dependsOn 'buildTravelPack' }

// Separate pinned public-domain SQLite/FTS5; no runtime or platform SQLite replacement.
tasks.register('buildPocketLoreIndex', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'bash', 'tools/runtime/build-index.sh'
}
tasks.named('preBuild').configure { dependsOn 'buildPocketLoreIndex' }
